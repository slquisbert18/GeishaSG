<!DOCTYPE html>
<!-- Indica que esta página utilizará Thymeleaf -->
<html
        lang="es"
        xmlns:th="http://www.thymeleaf.org"
        xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"

        layout:decorate="~{layout/layout}">

<head>
    <title>Instituciones</title>
</head>
<body>
<section layout:fragment="contenido">

    <h1 class="page-title">
        Instituciones
    </h1>

    <div class="toolbar">

        <div class="toolbar-left">
            <a th:href="@{/instituciones/nuevo}"
               class="btn btn-primary">
                <i class="bi bi-plus-circle"></i>
                Nueva institución
            </a>

            <a th:href="@{/instituciones/pdf}"
               target="_blank"
               class="btn btn-secondary"
               title="Imprimir / exportar PDF">
                <i class="bi bi-printer"></i>
                Imprimir
            </a>
        </div>

        <div class="toolbar-right">
            <form
                    class="search-form"
                    th:action="@{/instituciones}"
                    method="get">

                <div class="search-box-wrapper">
                    <input class="search-box"
                           type="text"
                           name="nombre"
                           th:value="${param.nombre}"
                           placeholder="Buscar institución...">
                    <a th:if="${param.nombre != null and !#strings.isEmpty(param.nombre[0])}"
                       th:href="@{/instituciones}"
                       class="btn-icon btn-clear-search"
                       title="Limpiar búsqueda">
                        <i class="bi bi-x-lg"></i>
                    </a>
                </div>

                <button class="btn btn-primary" type="submit">
                    <i class="bi bi-search"></i>
                </button>
            </form>
        </div>

    </div>

    <div class="table-container">

        <table>

            <thead>

            <tr>

                <th>ID</th>
                <th>Nombre</th>
                <th>Dirección</th>
                <th>Teléfono</th>
                <th>Correo</th>
                <th>Acciones</th>

            </tr>

            </thead>

            <tbody>
            <!-- Si existen instituciones, se muestran normalmente-->
            <tr th:each="institucion : ${instituciones}">

                <td th:text="${institucion.id}"></td>

                <td th:text="${institucion.nombre}"></td>

                <td th:text="${institucion.direccion}"></td>

                <td th:text="${institucion.telefono}"></td>

                <td th:text="${institucion.correo}"></td>

                <td>
                    <div class="table-actions">
                        <a
                                th:href="@{/instituciones/editar/{id}(id=${institucion.id})}"
                                class="btn btn-secondary"
                                title="Editar">

                            <i class="bi bi-pencil-square"></i>
                            <span class="btn-text">Editar</span>
                        </a>

                        <button
                                type="button"
                                class="btn btn-danger btn-eliminar"
                                data-url="/instituciones/eliminar"
                                data-entidad="institución"
                                title="Eliminar"
                                th:attr="
                                    data-id=${institucion.id},
                                    data-nombre=${institucion.nombre}">
                            <i class="bi bi-trash"></i>
                            <span class="btn-text">Eliminar</span>
                        </button>
                    </div>
                </td>

            </tr>

            <!-- Si la lista está vacía, mostramos un mensaje informativo -->
            <tr th:if="${#lists.isEmpty(instituciones)}">
                <td colspan="5" class="empty-message">
                    <i class="bi bi-search"></i>
                    No se encontraron instituciones.
                </td>
            </tr>

            </tbody>

        </table>

    </div>

    <div
            id="mensajeExito"
            th:if="${mensajeExito}"
            th:data-mensaje="${mensajeExito}"
            style="display:none;">
    </div>

</section>
</body>

</body>

</html>
