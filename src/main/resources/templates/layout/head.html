<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(titulo)">
    <meta charset="UTF-8">
    <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0">

    <title th:text="${titulo}">
        Geisha
    </title>

    <!-- token anti-CSRF: los <form> normales ya lo mandan solos
         (Spring inyecta un input oculto via th:action), pero las llamadas
         fetch() como la del modal de cliente rapido no pasan por eso y
         necesitan leerlo desde aqui para agregarlo manualmente -->
    <meta name="_csrf" th:content="${_csrf.token}">
    <meta name="_csrf_header" th:content="${_csrf.headerName}">

    <!-- CSS -->

    <link
            rel="stylesheet"
            th:href="@{/css/style.css}">

    <!-- Fuente -->

    <link rel="preconnect"
          href="https://fonts.googleapis.com">

    <link rel="preconnect"
          href="https://fonts.gstatic.com"
          crossorigin>

    <link
            href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
            rel="stylesheet">

    <!-- Bootstrap Icons -->

    <link
            rel="stylesheet"
            href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

</head>

</html>
