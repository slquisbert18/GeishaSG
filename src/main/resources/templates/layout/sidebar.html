<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.w3.org/1999/xhtml">

<aside class="sidebar" th:fragment="sidebar">

    <!-- Aplica el estado "colapsado" guardado por el usuario ANTES de que
         se pinte el resto del sidebar. Como cada clic en un item del menu
         recarga la pagina completa (Thymeleaf renderiza en el servidor),
         sin esto el sidebar se veria expandido de nuevo en cada navegacion. -->
    <script>
        if (localStorage.getItem("sidebarCollapsed") === "1") {
            document.currentScript.parentElement.classList.add("collapsed");
        }
    </script>

    <div class="logo">
        <span class="logo-red">■</span>

        <span class="logo-full">GEISHA</span>

        <span class="logo-short">G</span>
    </div>

    <nav>
        <ul>
            <li th:classappend="${modulo == 'inicio'} ? 'active'">
                <a th:href="@{/}">
                    <i class="bi bi-house"></i>
                    <span>Inicio</span>
                </a>
            </li>

            <li th:classappend="${modulo == 'instituciones'} ? 'active'">
                <a th:href="@{/instituciones}">
                    <i class="bi bi-building"></i>
                    <span>Instituciones</span>
                </a>
            </li>

            <li th:classappend="${modulo == 'tramites'} ? 'active'">
                <a th:href="@{/tramites}">
                    <i class="bi bi-card-list"></i>
                    <span>Trámites</span>
                </a>
            </li>

            <li th:classappend="${modulo == 'personas'} ? 'active'">
                <a th:href="@{/personas}">
                    <i class="bi bi-people"></i>
                    <span>Clientes</span>
                </a>
            </li>

            <!-- solo visible para ADMINISTRADOR: coincide con la restriccion -->
            <li th:classappend="${modulo == 'trabajadores'} ? 'active'"
                sec:authorize="hasRole('ADMINISTRADOR')">
                <a th:href="@{/trabajadores}">
                    <i class="bi bi-person-gear"></i>
                    <span>Usuarios</span>
                </a>
            </li>

            <li th:classappend="${modulo == 'pedidos'} ? 'active'">
                <a th:href="@{/pedidos}">
                    <i class="bi bi-bag"></i>
                    <span>Pedidos</span>
                </a>
            </li>

            <li th:classappend="${modulo == 'notificaciones'} ? 'active'">
                <a th:href="@{/notificaciones}">
                    <i class="bi bi-bell"></i>
                    <span>Notificaciones</span>
                </a>
            </li>

            <li th:classappend="${modulo == 'estadisticas'} ? 'active'">
                <a th:href="@{/estadisticas}">
                    <i class="bi bi-graph-up"></i>
                    <span>Estadísticas</span>
                </a>
            </li>

        </ul>

    </nav>

</aside>

</html>
