<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<header class="topbar" th:fragment="topbar">

    <!-- Barra superior -->
    <button id="btnMenu">
        <i class="bi bi-list"></i>
    </button>

    <div class="topbar-right">

        <div class="notificaciones-campanita">

            <button id="btnCampanita">
                <i class="bi bi-bell"></i>
                <span id="badgeCampanita" class="badge-campanita" style="display:none;"></span>
            </button>

            <div id="dropdownCampanita" class="dropdown-campanita">
                <div class="dropdown-campanita-header">
                    Cumpleaños próximos
                </div>
                <div id="listaCampanita" class="dropdown-campanita-lista">
                    <!-- app.js llena esto con GET /notificaciones/resumen -->
                </div>
                <a th:href="@{/notificaciones}" class="dropdown-campanita-footer">
                    Ver todas
                </a>
            </div>

        </div>

        <!-- sec:authentication="name" toma el username del usuario logueado
             (viene de UsuarioDetails.getUsername(), o sea nombre_usuario) -->
        <span sec:authentication="name">Usuario</span>

        <form th:action="@{/logout}" method="post" class="logout-form">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
            <button type="submit" title="Cerrar sesión">
                <i class="bi bi-box-arrow-right"></i>
            </button>
        </form>

    </div>

</header>

</html>
