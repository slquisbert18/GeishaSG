<!DOCTYPE html>
<html
        lang="es"
        xmlns:th="http://www.thymeleaf.org"
        xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">

<head th:replace="~{layout/head :: head(${title})}"></head>

<body>

<div class="layout">

    <!-- Sidebar -->
    <div th:replace="~{layout/sidebar :: sidebar}"></div>

    <div class="main">

        <!-- Barra superior -->
        <div th:replace="~{layout/topbar :: topbar}"></div>

        <!-- Contenido de cada página -->
        <main class="content" layout:fragment="contenido">

        </main>

        <!-- Footer -->
        <div th:replace="~{layout/footer :: footer}"></div>

    </div>

</div>

<!-- Modal reutilizable -->
<div th:replace="~{components/modal :: modal}"></div>

<!-- modal de especificaciones fotograficas -->
<div th:replace="~{components/modal_foto :: modalFoto}"></div>

<script th:src="@{/js/app.js}"></script>

</body>

</html>
