<!DOCTYPE html>
<html
        lang="es"
        xmlns:th="http://www.thymeleaf.org"
        xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">

<head th:replace="~{layout/head :: head(${title})}"></head>

<body>

<div class="layout">

    <!-- Sidebar -->
    <div th:replace="~{layout/sidebar :: sidebar}"></div>

    <!-- Fondo oscuro que aparece detras del sidebar cuando esta
         abierto en pantallas moviles; al tocarlo se cierra -->
    <div id="sidebarOverlay" class="sidebar-overlay"></div>

    <div class="main">

        <!-- Barra superior -->
        <div th:replace="~{layout/topbar :: topbar}"></div>

        <!-- Contenido de cada página -->
        <main class="content" layout:fragment="contenido">

        </main>

        <!-- Footer -->
        <div th:replace="~{layout/footer :: footer}"></div>

    </div>

</div>

<!-- Modal reutilizable -->
<div th:replace="~{components/modal :: modal}"></div>

<!-- modal de especificaciones fotograficas -->
<div th:replace="~{components/modal_foto :: modalFoto}"></div>

<!-- modal de detalle de pedido -->
<div th:replace="~{components/modal_pedido :: modalPedido}"></div>

<!-- modal para agregar un cliente rapido desde el formulario de pedido -->
<div th:replace="~{components/modal_cliente :: modalCliente}"></div>

<!-- modal de vista previa de la foto de referencia de un cliente -->
<div th:replace="~{components/modal_foto_cliente :: modalFotoCliente}"></div>

<!-- modal de vista previa de la imagen del trabajo final realizado -->
<div th:replace="~{components/modal_foto_trabajo :: modalFotoTrabajo}"></div>

<script th:src="@{/js/app.js}"></script>

</body>

</html>
