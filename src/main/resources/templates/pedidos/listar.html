<!DOCTYPE html>

<html
        lang="es"
        xmlns:th="http://www.thymeleaf.org"
        xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
        layout:decorate="~{layout/layout}">

<head>
    <title>Pedidos</title>
</head>

<body>

<section layout:fragment="contenido">

    <h1 class="page-title">
        Pedidos
    </h1>

    <p class="page-subtitle">
        <span th:if="${fecha != null and fecha.isEqual(T(java.time.LocalDate).now())}">
            Pedidos de hoy
        </span>
        <span th:if="${fecha != null and !fecha.isEqual(T(java.time.LocalDate).now())}"
              th:text="'Pedidos del ' + ${#temporals.format(fecha, 'dd/MM/yyyy')}">
        </span>
        <span th:if="${fecha == null}">
            Mostrando pedidos de todos los días
        </span>
    </p>


    <!-- Barra de herramientas -->
    <div class="toolbar">

        <div class="toolbar-left">

            <a th:href="@{/pedidos/nuevo}"
               class="btn btn-primary">

                <i class="bi bi-plus-circle"></i>
                Nuevo pedido

            </a>


            <a th:href="@{/pedidos/pdf(fecha=${fecha}, buscar=${buscar})}"
               target="_blank"
               class="btn btn-secondary"
               title="Imprimir / exportar PDF">
                <i class="bi bi-printer"></i>
                Imprimir
            </a>
        </div>


        <div class="toolbar-right">

            <form
                    class="search-form"
                    th:action="@{/pedidos}"
                    method="get">

                <!-- sin fecha en la URL, el controlador asume "hoy" (ver
                     PedidoController.listar); este input siempre manda un
                     valor explicito una vez que el usuario lo toca -->
                <input
                        type="date"
                        name="fecha"
                        class="form-control"
                        th:value="${fecha}"
                        title="Filtrar por fecha">

                <div class="search-box-wrapper">
                    <input
                            class="search-box"
                            type="text"
                            name="buscar"
                            th:value="${buscar}"
                            placeholder="Buscar cliente...">

                    <a th:if="${buscar != null and !buscar.isEmpty()}"
                       th:href="@{/pedidos(fecha=${fecha})}"
                       class="btn-icon btn-clear-search"
                       title="Limpiar búsqueda">
                        <i class="bi bi-x-lg"></i>
                    </a>
                </div>

                <button
                        class="btn btn-primary"
                        type="submit">

                    <i class="bi bi-search"></i>

                </button>

                <!-- quita el filtro de fecha (manda fecha vacio a
                     proposito, para no caer de nuevo en el "hoy" por
                     defecto) y deja ver pedidos de cualquier dia -->
                <a th:if="${fecha != null}"
                   th:href="@{/pedidos(fecha='', buscar=${buscar})}"
                   class="btn btn-secondary"
                   title="Quitar el filtro de fecha">
                    Ver todos los días
                </a>

            </form>

        </div>

    </div>


    <!-- Tabla de pedidos -->
    <div class="table-container">

        <table>

            <thead>

            <tr>

                <th>ID</th>
                <th>Fecha</th>
                <th>Cliente</th>
                <th>Usuario</th>
                <th>Monto total</th>
                <th>Acciones</th>

            </tr>

            </thead>


            <tbody>

            <!-- Pedidos -->
            <tr th:each="pedido : ${pedidos}">

                <td th:text="${pedido.id}"></td>

                <td th:text="${#temporals.format(
                        pedido.fechaRegistro,
                        'dd/MM/yyyy HH:mm'
                )}">
                </td>

                <td th:text="${pedido.cliente.nombres + ' ' + pedido.cliente.apellidos}">
                </td>

                <td th:text="${pedido.empleado.nombres + ' ' + pedido.empleado.apellidos}">
                </td>

                <td>
                    Bs.
                    <span
                            th:text="${#numbers.formatDecimal(
                                pedido.montoTotal,
                                1,
                                2
                            )}">
                    </span>
                </td>


                <td>

                    <div class="table-actions">

                        <!-- PDF del detalle de este pedido puntual -->
                        <a
                                th:href="@{/pedidos/{id}/pdf(id=${pedido.id})}"
                                target="_blank"
                                class="btn-icon-pdf"
                                title="Exportar este pedido a PDF">
                            <i class="bi bi-file-earmark-pdf"></i>
                        </a>

                        <!-- Detalles -->
                        <button
                                type="button"
                                class="btn btn-secondary btn-detalle-pedido"
                                title="Detalles"
                                th:attr="data-id=${pedido.id}">

                            <i class="bi bi-eye"></i>
                            <span class="btn-text">Detalles</span>

                        </button>

                        <!-- Editar -->
                        <a
                                th:href="@{/pedidos/editar/{id}(id=${pedido.id})}"
                                class="btn btn-secondary"
                                title="Editar">

                            <i class="bi bi-pencil-square"></i>
                            <span class="btn-text">Editar</span>

                        </a>


                        <!-- Eliminar -->
                        <button
                                type="button"
                                class="btn btn-danger btn-eliminar"
                                data-url="/pedidos/eliminar"
                                data-entidad="pedido"
                                title="Eliminar"
                                th:attr="data-id=${pedido.id}">

                            <i class="bi bi-trash"></i>
                            <span class="btn-text">Eliminar</span>

                        </button>

                    </div>

                </td>

            </tr>


            <!-- Lista vacía -->
            <tr th:if="${#lists.isEmpty(pedidos)}">

                <td
                        colspan="6"
                        class="empty-message">

                    <i class="bi bi-search"></i>

                    No se encontraron pedidos.

                </td>

            </tr>

            </tbody>

        </table>

    </div>


    <!-- Mensaje de éxito -->
    <div
            id="mensajeExito"
            th:if="${mensajeExito}"
            th:data-mensaje="${mensajeExito}"
            style="display:none;">
    </div>


</section>

</body>

</html>
