<!DOCTYPE html>

<html lang="es"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/layout}">

<head>
    <title>Pedido</title>
</head>

<body>

<section layout:fragment="contenido">

    <h1 class="page-title" th:text="${tituloFormulario}">
        Nuevo pedido
    </h1>

    <div class="form-card">

        <form
                th:action="@{/pedidos/guardar}"
                th:object="${pedido}"
                method="post">

            <!-- ID -->
            <input type="hidden" th:field="*{id}">

            <!-- ===== datos generales del pedido ===== -->
            <div class="form-section">

                <h3 class="form-section-title">
                    Datos del pedido
                </h3>

                <div class="form-grid">

                    <!-- Cliente: combobox + boton para agregar uno nuevo -->
                    <div class="form-group">

                        <label class="form-label">
                            Cliente
                        </label>

                        <div class="combobox-with-button">

                            <div class="combobox">

                                <input
                                        type="text"
                                        id="clienteInput"
                                        class="form-control"
                                        placeholder="Escriba para buscar un cliente..."
                                        autocomplete="off"
                                        th:value="${pedido.cliente != null ? pedido.cliente.nombres + ' ' + pedido.cliente.apellidos : ''}">

                                <input
                                        type="hidden"
                                        id="clienteHidden"
                                        name="cliente"
                                        th:value="${pedido.cliente != null ? pedido.cliente.id : ''}">

                                <ul id="clienteDropdown"
                                    class="combobox-dropdown"></ul>

                            </div>

                            <!-- abre el modal para registrar un cliente sin salir de este formulario -->
                            <button type="button"
                                    id="btnNuevoCliente"
                                    class="btn btn-secondary"
                                    title="Agregar nuevo cliente">
                                <i class="bi bi-plus-lg"></i>
                            </button>

                        </div>

                        <!-- mensaje de error del servidor (si se intento
                             guardar sin seleccionar un cliente valido) -->
                        <p id="errorCliente" class="field-error" th:if="${errorCliente}">
                            Debe seleccionar un cliente de la lista.
                        </p>

                    </div>


                    <!-- Monto total: solo lectura, se calcula sumando el
                         precio de cada trabajo agregado abajo. No tiene
                         "name": no se envia, el backend recalcula el total
                         con los precios de cada fila (ver PedidoController) -->
                    <div class="form-group">

                        <label class="form-label">
                            Monto total
                        </label>

                        <input
                                type="text"
                                id="montoTotalDisplay"
                                class="form-control monto-total-input"
                                th:value="${pedido.montoTotal != null ? pedido.montoTotal : '0.00'}"
                                readonly>

                    </div>

                </div>

            </div>

            <!-- ===== trabajos del pedido (detalle_trabajo) ===== -->
            <div class="form-section">

                <div class="trabajos-header">

                    <h3 class="form-section-title">
                        Trabajos
                    </h3>

                    <button type="button" id="btnAgregarTrabajo" class="btn btn-secondary">
                        <i class="bi bi-plus-circle"></i>
                        Agregar trabajo
                    </button>

                </div>

                <p id="errorTrabajos" class="field-error" th:if="${errorTrabajos}" th:text="${errorTrabajos}"></p>

                <!-- etiquetas de columna, alineadas con las mismas
                     proporciones que .detalle-row (ver style.css) -->
                <div class="detalle-row detalle-row-header">
                    <span>Trámite</span>
                    <span>Precio (Bs.)</span>
                    <span>Observaciones</span>
                    <span>Trabajo final</span>
                    <span></span>
                </div>

                <div id="filasTrabajos">

                    <!-- filas ya existentes cuando se edita un pedido -->
                    <div class="detalle-row" th:each="detalle : ${pedido.detalles}">

                        <div class="combobox">
                            <input
                                    type="text"
                                    class="form-control tramite-input"
                                    placeholder="Buscar trámite..."
                                    autocomplete="off"
                                    th:value="${detalle.tramite != null ? detalle.tramite.nombre : ''}">

                            <input
                                    type="hidden"
                                    class="tramite-id-input"
                                    name="detalleTramiteId"
                                    th:value="${detalle.tramite != null ? detalle.tramite.id : ''}">

                            <ul class="combobox-dropdown tramite-dropdown"></ul>
                        </div>

                        <input
                                type="number"
                                step="0.01"
                                min="0"
                                class="form-control precio-input"
                                name="detallePrecio"
                                placeholder="0.00"
                                th:value="${detalle.precioServicio}">

                        <input
                                type="text"
                                class="form-control obs-input"
                                name="detalleObservaciones"
                                placeholder="Opcional"
                                th:value="${detalle.observaciones}">

                        <div class="input-with-button">
                            <input
                                    type="text"
                                    class="form-control ruta-input"
                                    name="detalleRuta"
                                    placeholder="Ruta del archivo..."
                                    th:value="${detalle.ruta}">

                            <button type="button" class="btn btn-secondary btn-examinar-ruta" title="Examinar...">
                                <i class="bi bi-folder2-open"></i>
                            </button>
                        </div>

                        <button type="button" class="btn btn-icon btn-eliminar-fila" title="Quitar trabajo">
                            <i class="bi bi-trash"></i>
                        </button>

                    </div>

                </div>

                <!-- plantilla de una fila vacia: no se muestra en pantalla,
                     app.js la clona cada vez que se agrega un trabajo -->
                <template id="plantillaFilaTrabajo">
                    <div class="detalle-row">

                        <div class="combobox">
                            <input
                                    type="text"
                                    class="form-control tramite-input"
                                    placeholder="Buscar trámite..."
                                    autocomplete="off">

                            <input type="hidden" class="tramite-id-input" name="detalleTramiteId">

                            <ul class="combobox-dropdown tramite-dropdown"></ul>
                        </div>

                        <input
                                type="number"
                                step="0.01"
                                min="0"
                                class="form-control precio-input"
                                name="detallePrecio"
                                placeholder="0.00">

                        <input
                                type="text"
                                class="form-control obs-input"
                                name="detalleObservaciones"
                                placeholder="Opcional">

                        <div class="input-with-button">
                            <input
                                    type="text"
                                    class="form-control ruta-input"
                                    name="detalleRuta"
                                    placeholder="Ruta del archivo...">

                            <button type="button" class="btn btn-secondary btn-examinar-ruta" title="Examinar...">
                                <i class="bi bi-folder2-open"></i>
                            </button>
                        </div>

                        <button type="button" class="btn btn-icon btn-eliminar-fila" title="Quitar trabajo">
                            <i class="bi bi-trash"></i>
                        </button>

                    </div>
                </template>

            </div>


            <div class="form-actions">

                <a th:href="@{/pedidos}"
                   class="btn btn-secondary">

                    <i class="bi bi-x-circle"></i>
                    Cancelar

                </a>

                <button
                        type="submit"
                        class="btn btn-primary">

                    <i class="bi bi-floppy"></i>
                    Guardar

                </button>

            </div>

        </form>

    </div>

    <!-- datos para los combobox: se generan aqui en JSON (ver
        PedidoController.agregarDatosDeApoyo). app.js (cargado
        globalmente desde el layout) los usa como arreglos JS listos, sin
        tener que volver a pedirlos al servidor -->
    <script th:inline="javascript">
        const CLIENTES = /*[(${clientesJson})]*/ [];
        const TRAMITES = /*[(${tramitesJson})]*/ [];
    </script>

</section>

</body>

</html>
