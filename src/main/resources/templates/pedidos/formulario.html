<!DOCTYPE html>

<html lang="es"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/layout}">

<head>
    <title>Pedido</title>
</head>

<body>

<section layout:fragment="contenido">

    <h1 class="page-title" th:text="${tituloFormulario}">
        Nuevo pedido
    </h1>

    <div class="form-card">

        <form
                th:action="@{/pedidos/guardar}"
                th:object="${pedido}"
                method="post">

            <!-- ID -->
            <input type="hidden" th:field="*{id}">

            <div class="form-grid">

                <!-- Cliente: combobox -->
                <div class="form-group combobox">

                    <label class="form-label">
                        Cliente
                    </label>

                    <input
                            type="text"
                            id="clienteInput"
                            class="form-control"
                            placeholder="Escriba para buscar un cliente..."
                            autocomplete="off"
                            th:value="${pedido.cliente != null ? pedido.cliente.nombres + ' ' + pedido.cliente.apellidos : ''}">

                    <input
                            type="hidden"
                            id="clienteHidden"
                            name="cliente"
                            th:value="${pedido.cliente != null ? pedido.cliente.id : ''}">

                    <ul id="clienteDropdown" class="combobox-dropdown"></ul>

                    <!-- mensaje de error del servidor (si se intento
                         guardar sin seleccionar un cliente valido) -->
                    <p id="errorCliente" class="field-error" th:if="${errorCliente}">
                        Debe seleccionar un cliente de la lista.
                    </p>

                </div>


                <!-- Monto total -->
                <!-- Monto total: solo lectura, se calcula sumando el
                     precio de cada trabajo agregado abajo. No tiene
                     "name": no se envia, el backend recalcula el total
                     con los precios de cada fila (ver PedidoController) -->
                <div class="form-group">

                    <label class="form-label">
                        Monto total
                    </label>

                    <input
                            type="text"
                            id="montoTotalDisplay"
                            class="form-control"
                            th:value="${pedido.montoTotal != null ? pedido.montoTotal : '0.00'}"
                            readonly>

                </div>

            </div>

            <!-- TRABAJOS DEL PEDIDO (detalle_trabajo) -->
            <h3>Trabajos</h3>

            <div id="filasTrabajos">

                <!-- filas ya existentes cuando se edita un pedido -->
                <div class="detalle-row" th:each="detalle : ${pedido.detalles}">

                    <div class="combobox">
                        <input
                                type="text"
                                class="form-control tramite-input"
                                placeholder="Buscar trámite..."
                                autocomplete="off"
                                th:value="${detalle.tramite.nombre}">

                        <input
                                type="hidden"
                                class="tramite-id-input"
                                name="detalleTramiteId"
                                th:value="${detalle.tramite.id}">

                        <ul class="combobox-dropdown tramite-dropdown"></ul>
                    </div>

                    <input
                            type="number"
                            step="0.01"
                            min="0"
                            class="form-control precio-input"
                            name="detallePrecio"
                            placeholder="Precio"
                            th:value="${detalle.precioServicio}">

                    <input
                            type="text"
                            class="form-control obs-input"
                            name="detalleObservaciones"
                            placeholder="Observaciones (opcional)"
                            th:value="${detalle.observaciones}">

                    <button type="button" class="btn btn-icon btn-eliminar-fila">
                        <i class="bi bi-trash"></i>
                    </button>

                </div>

            </div>

            <button type="button" id="btnAgregarTrabajo" class="btn btn-secondary">
                <i class="bi bi-plus-circle"></i>
                Agregar trabajo
            </button>

            <!-- plantilla de una fila vacia: no se muestra en pantalla,
                 pedido-form.js la clona cada vez que se agrega un trabajo -->
            <template id="plantillaFilaTrabajo">
                <div class="detalle-row">

                    <div class="combobox">
                        <input
                                type="text"
                                class="form-control tramite-input"
                                placeholder="Buscar trámite..."
                                autocomplete="off">

                        <input type="hidden" class="tramite-id-input" name="detalleTramiteId">

                        <ul class="combobox-dropdown tramite-dropdown"></ul>
                    </div>

                    <input
                            type="number"
                            step="0.01"
                            min="0"
                            class="form-control precio-input"
                            name="detallePrecio"
                            placeholder="Precio">

                    <input
                            type="text"
                            class="form-control obs-input"
                            name="detalleObservaciones"
                            placeholder="Observaciones (opcional)">

                    <button type="button" class="btn btn-icon btn-eliminar-fila">
                        <i class="bi bi-trash"></i>
                    </button>

                </div>
            </template>


            <div class="form-actions">

                <a th:href="@{/pedidos}"
                   class="btn btn-secondary">

                    <i class="bi bi-x-circle"></i>
                    Cancelar

                </a>

                <button
                        type="submit"
                        class="btn btn-primary">

                    <i class="bi bi-floppy"></i>
                    Guardar

                </button>

            </div>

        </form>

    </div>

    <!-- datos para los combobox: se generan aqui en JSON (ver
        PedidoController.agregarDatosDeApoyo) y "pedido-form.js" los usa
        como arreglos JS listos, sin tener que volver a pedirlos al
        servidor -->
    <script th:inline="javascript">
        const CLIENTES = /*[(${clientesJson})]*/ [];
        const TRAMITES = /*[(${tramitesJson})]*/ [];
    </script>

    <script th:src="@{/js/combobox.js}"></script>
    <script th:src="@{/js/pedido-form.js}"></script>

</section>

</body>

</html>
