<!DOCTYPE html>

<html lang="es"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/layout}">

<head>
    <title>Pedido</title>
</head>

<body>

<section layout:fragment="contenido">

    <h1 class="page-title" th:text="${tituloFormulario}">
        Nuevo pedido
    </h1>

    <div class="form-card">

        <form
                th:action="@{/pedidos/guardar}"
                th:object="${pedido}"
                method="post">

            <!-- ID -->
            <input type="hidden" th:field="*{id}">

            <div class="form-grid">

                <!-- Cliente -->
                <div class="form-group">

                    <label class="form-label">
                        Cliente *
                    </label>

                    <select
                            class="form-control"
                            th:field="*{cliente}">

                        <option value="">
                            Seleccione un cliente
                        </option>

                        <option
                                th:each="persona : ${clientes}"
                                th:value="${persona.id}"
                                th:text="${persona.nombres + ' ' + persona.apellidos}">
                        </option>

                    </select>

                </div>


                <!-- Monto total -->
                <div class="form-group">

                    <label class="form-label">
                        Monto total *
                    </label>

                    <input
                            type="number"
                            step="0.01"
                            min="0"
                            class="form-control"
                            th:field="*{montoTotal}"
                            placeholder="0.00">

                </div>


                <!-- Fecha de registro -->
                <div class="form-group">

                    <label class="form-label">
                        Fecha de registro
                    </label>

                    <input
                            type="datetime-local"
                            class="form-control"
                            name="fechaRegistro"
                            th:value="${pedido.fechaRegistro != null ? #temporals.format(pedido.fechaRegistro, 'yyyy-MM-dd''T''HH:mm') : ''}">

                </div>

            </div>


            <div class="form-actions">

                <a th:href="@{/pedidos}"
                   class="btn btn-secondary">

                    <i class="bi bi-x-circle"></i>
                    Cancelar

                </a>

                <button
                        type="submit"
                        class="btn btn-primary">

                    <i class="bi bi-floppy"></i>
                    Guardar

                </button>

            </div>

        </form>

    </div>

</section>

</body>

</html>
