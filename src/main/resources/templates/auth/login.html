<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{layout/head :: head('Iniciar sesión')}"></head>

<body>

<main class="login-page">

    <div class="form-card login-card">

        <h1 class="page-title">Geisha</h1>
        <p>Inicia sesión para continuar</p>

        <!-- credenciales invalidas: SecurityConfig redirige a /login?error -->
        <p th:if="${param.error}" class="mensaje-error">
            Usuario o contraseña incorrectos.
        </p>

        <!-- se acaba de cerrar sesion: SecurityConfig redirige a /login?logout -->
        <p th:if="${param.logout}" class="mensaje-exito">
            Sesión cerrada correctamente.
        </p>

        <!-- Spring Security intercepta este POST en /login (loginProcessingUrl),
             nunca llega a un @PostMapping propio. Los nombres "username" y
             "password" son los que Spring Security espera por defecto. -->
        <form th:action="@{/login}" method="post">

            <!-- token anti-CSRF: Spring Security lo exige en todo POST -->
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

            <div class="form-group">
                <label class="form-label">Usuario</label>
                <input type="text" name="username" class="form-control" required autofocus>
            </div>

            <div class="form-group">
                <label class="form-label">Contraseña</label>
                <input type="password" name="password" class="form-control" required>
            </div>

            <button type="submit" class="btn btn-primary">
                Ingresar
            </button>

        </form>

    </div>

</main>

</body>

</html>
