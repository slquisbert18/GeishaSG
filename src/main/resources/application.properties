spring.application.name=geisha

# Spring Boot activa "modo headless" por defecto, lo que bloquea
# cualquier ventana grafica (como el explorador de archivos nativo que
# usa el boton "Examinar" al registrar un trabajo). Se desactiva para
# permitir esa ventana.
spring.main.headless=false

# Configuración de PostgreSQL
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:geishaDB}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:2010}

# Driver
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# PostgreSQL
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Carpeta donde se guardan las fotos de los clientes.
# Por defecto es una carpeta relativa a donde se ejecuta la app (junto
# al .jar, o dentro del proyecto si corres desde el IDE), asi que
# funciona igual en tu PC, en Docker y en la copia portable sin tocar
# nada. Si alguna vez se necesita guardar en otro lugar, se puede
# sobreescribir con la variable de entorno FOTOS_DIR.
app.fotos.directorio=${FOTOS_DIR:./fotos-clientes}

# Limite de tamaño por archivo/formulario subido (las fotos de un
# estudio fotografico pueden pesar varios MB)
spring.servlet.multipart.max-file-size=15MB
spring.servlet.multipart.max-request-size=15MB